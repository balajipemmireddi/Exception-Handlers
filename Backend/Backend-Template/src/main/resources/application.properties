spring.config.import=optional:file:.env[.properties]
spring.application.name=HotelBooking

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_booking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Neha@1234}

server.port=${PORT:8080}

# Let Hibernate manage schema via ddl-auto; data.sql seeds roles
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Run data.sql after Hibernate has created/updated the schema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3ItaGFja2F0aG9uLWp3dC10b2tlbnM=}
jwt.expiration.ms=${JWT_EXPIRATION_MS:108000000}

# CORS
frontend.url=${FRONTEND_URL:http://localhost:5173}
